# US-0406: a new identity, so macOS sees a new app. userData stays in aidlc-dash (src/main/index.js).
appId: se.auctum.thadeus
# Without dots, so the bundle is THADEUS.app; the UI shows "T.H.A.D.E.U.S." (src/shared/appName.js).
productName: THADEUS
directories:
  output: dist
  buildResources: build
# 1024x1024 source; electron-builder derives the macOS .icns and the Linux icon sizes from it.
icon: build/icon.png
files:
  - out/**
  - package.json
# Linux has no app-bundle icon, so the main process passes this file to BrowserWindow.
extraResources:
  - from: build/icon.png
    to: icon.png
# node-pty loads a native binary and spawn-helper; they cannot run from inside the asar archive.
asarUnpack:
  - node_modules/node-pty/**
# Releases are uploaded by .github/workflows/release.yml with `gh release`, not by electron-builder.
publish: null
mac:
  target:
    - target: dmg
      arch: universal
  category: public.app-category.developer-tools
  # node-pty ships per-arch prebuilt binaries that are identical in the x64 and arm64 builds;
  # tell @electron/universal to keep them as-is instead of failing the merge.
  x64ArchFiles: "Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/**"
  # Unsigned internal build: no signing identity, no notarisation.
  identity: null
dmg:
  artifactName: THADEUS-${version}-${arch}.dmg
linux:
  target:
    - target: deb
      arch: x64
  category: Development
  # Folder of NxN.png files (16-512): Ubuntu's hicolor theme does not look up a lone 1024 px icon.
  icon: build/icons
  # Keep macOS/Windows node-pty prebuilds out of the .deb; scripts/check-glibc.mjs verifies this in CI.
  files:
    - "!node_modules/node-pty/prebuilds/darwin-*/**"
    - "!node_modules/node-pty/prebuilds/win32-*/**"
  executableName: thadeus
  # The launcher entry shows the dotted name; StartupWMClass stays productName, which is the window's WM_CLASS.
  desktop:
    entry:
      Name: T.H.A.D.E.U.S.
  maintainer: Auctum Solutions AB <info@auctum.se>
  synopsis: Read-only AI-DLC console with an embedded Claude terminal
deb:
  artifactName: thadeus_${version}_${arch}.deb
  # The package was called aidlc-dash before US-0406; installing thadeus removes it.
  fpm:
    - "--replaces=aidlc-dash"
    - "--conflicts=aidlc-dash"
