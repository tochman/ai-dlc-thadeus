# Builds T.H.A.D.E.U.S. for macOS (universal .dmg) and Linux (.deb, x64).
# On a version tag it also publishes both to a GitHub Release in this repository (unsigned builds).
# On a pull request it only tests and builds, so packaging problems (e.g. the Linux glibc check) show up before a tag.
name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists a pull request's commits

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans every commit of the pull request (US-1101 FR4.2)
      # A secret in any commit blocks the merge; false positives go in .gitleaksignore with their fingerprint.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm ci
      # Each gate is its own step, so a failure names it (US-0506 NFR8.2-NFR8.4).
      - name: Tests with the 80% line coverage floor
        run: npx vitest run tests/ --coverage
        env:
          THADEUS_REQUIRE_DASH: '1' # the hook script tests must run under dash too, not be skipped
      - name: ESLint
        run: npx eslint . --max-warnings 0
      - name: Prettier
        run: npx prettier --check .
      # US-0608 FR9.3: the planning end-to-end tests drive the built app. Ubuntu 24.04 blocks the unprivileged user
      # namespaces Electron's sandbox needs, so that is allowed for this job; xvfb gives Electron a display.
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests of the built app
        run: |
          npx electron-vite build
          xvfb-run -a npx playwright test

  build-mac:
    needs: verify
    # The packages are built only for a release: on a tag, and on a release/vX.Y.Z pull request so packaging is proven
    # before the tag. Story and fix pull requests run verify only.
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.head_ref, 'release/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # US-0608 FR9.3: the same end-to-end tests against the macOS build in out/.
      - name: End-to-end tests of the built app
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: error

  build-linux:
    needs: verify
    # The packages are built only for a release: on a tag, and on a release/vX.Y.Z pull request so packaging is proven
    # before the tag. Story and fix pull requests run verify only.
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.head_ref, 'release/')
    # node-pty is compiled on the runner and links against its glibc/libstdc++. Building on 22.04 keeps the
    # .deb runnable on Ubuntu 22.04 and newer; ubuntu-latest produced a pty.node that needed GLIBC_2.42 (v0.1.0).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:linux
      - name: Native binaries run on Ubuntu 22.04 (glibc 2.35, GLIBCXX_3.4.30)
        run: node scripts/check-glibc.mjs dist/linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: [build-mac, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The app's updater verifies its download against this file and stops on a mismatch (EPIC-04 US-0407).
      - name: Checksums
        run: |
          mkdir -p upload
          cp artifacts/mac/*.dmg artifacts/linux/*.deb upload/
          (cd upload && sha256sum *.dmg *.deb > SHA256SUMS.txt)
          cat upload/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" upload/*.dmg upload/*.deb upload/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "T.H.A.D.E.U.S. ${GITHUB_REF_NAME}" \
            --generate-notes
