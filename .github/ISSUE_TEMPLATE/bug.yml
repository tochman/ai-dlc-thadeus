name: Bug report
description: Something in T.H.A.D.E.U.S. does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go to the Security tab (see SECURITY.md), not here.
        Please leave out private paths, project names and anything secret from logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: From About.
      placeholder: 0.2.6
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux (Ubuntu 22.04 or later)
        - Other Linux
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: AI-DLC version and agent harness
      description: The output of `aidlc --version`, and Claude Code or opencode.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots or a note on what you already tried.
